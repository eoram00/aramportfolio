[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  # The public site origin is not a credential. Keep scanning all actual secrets.
  SECRETS_SCAN_OMIT_KEYS = "APP_URL"

[functions]
  node_bundler = "esbuild"
  included_files = ["privacy-settings.json", "privacy-settings.netlify.json"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/requests?route=:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    X-Frame-Options = "DENY"
